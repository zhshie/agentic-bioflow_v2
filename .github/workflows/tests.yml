# T20: the release check (docs/TESTING.md, tests/run_all.sh) has always been
# something a person had to remember to run by hand - "No CI exists" was
# CLAUDE.md's own honest line about this repo until now. A test suite that
# only runs when someone remembers it is a test suite one missed step away
# from silently going stale, the same shape PITFALLS 19 already recorded for
# other untested markers in this repo: "an untested marker has an excuse
# attached, and the excuse is usually a measurement" - here the excuse would
# have been "somebody ran it before merging", unverifiable after the fact.
#
# ubuntu-latest only, deliberately: this suite already documents that it
# needs a Linux/macOS bash and refuses outright on native Windows Git Bash
# (tests/run_all.sh's own header, issue #1) - a Windows runner would need the
# same WSL bridge a member's own laptop needs (PITFALLS 16g), which is not
# something to stand up inside a CI runner for a suite that touches no
# network, no cluster and no real settings file in the first place
# (tests/run_all.sh's own "Not in scope" paragraph).
#
# jq is installed explicitly before the suite runs, not left to whatever the
# runner image happens to ship: PITFALLS 28 and this branch's own T1 card
# exist because jq's absence is exactly the kind of gap that goes unnoticed
# until a real machine hits it, and a CI image that already has jq
# preinstalled would never exercise the ordinary path most contributors use.
# relay_connect_test.py is excluded the same way run_all.sh already excludes
# it from itself - a manual probe needing a live relay and a host argument,
# not a file this can run unattended.
#
# jq 1.6 fast path (issue #95): the hooks' one-call jq program broke silently on
# jq 1.6 - the default on WSL / Ubuntu 22.04, where most members run - because
# the runner's apt jq is newer and never exercised it. So a second step downloads
# the official jq 1.6 binary, checks a pinned sha256 (published in the jq repo at
# sig/v1.6/sha256sum.txt, tag jq-1.6), keeps it off the default PATH, and runs
# tests/jq_versions_test.sh with ABF_JQ16 pointing at it. That test FAILS (not
# SKIPs) when ABF_JQ16 is set but is not a working jq 1.6, so the step cannot
# pass vacuously.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  run_all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: bash tests/run_all.sh
        run: bash tests/run_all.sh

      - name: jq 1.6 fast path
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/jq16"
          mkdir -p "$d"
          curl -fsSL -o "$d/jq" https://github.com/jqlang/jq/releases/download/jq-1.6/jq-linux64
          echo "af986793a515d500ab2d35f8d2aecd656e764504b789b66d7e1a0b727a124c44  $d/jq" | sha256sum -c -
          chmod +x "$d/jq"
          ABF_JQ16="$d/jq" bash tests/jq_versions_test.sh
