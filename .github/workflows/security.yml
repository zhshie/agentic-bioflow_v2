name: security

# Separate from tests.yml on purpose: the required check (run_all/shard) is untouched.
# Observation period: not a required check yet.

on:
  pull_request:
  push:
    branches: [v3, main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned version, checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Scan full history
        run: gitleaks git --redact --no-banner --config .gitleaks.toml
      - name: Scan this PR's commits
        if: github.event_name == 'pull_request'
        run: gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts "origin/${{ github.base_ref }}..HEAD"

  pip-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Audit dependencies
        run: |
          IGNORES=""
          while read -r id _; do
            case "$id" in ""|\#*) continue ;; esac
            IGNORES="$IGNORES --ignore-vuln $id"
          done < platform/pip-audit-ignore.txt
          pip-audit -r platform/constraints.txt --no-deps --disable-pip $IGNORES
          pip-audit ./platform $IGNORES
