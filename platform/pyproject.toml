[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "abf-platform"
version = "0.1.0"
description = "Receiver for Nextflow's trace messages, a read-only MCP server over the runs it recorded, and the station agent that answers read-only site jobs"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[project.scripts]
abf-platform = "abf_platform.cli:main"
abf-station = "abf_station.cli:main"

[tool.setuptools]
packages = ["abf_platform", "abf_platform.actions", "abf_station", "abf_launch"]
package-data = {"abf_platform" = ["skills/*/SKILL.md", "data/*.json", "data/*.json.gz"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
